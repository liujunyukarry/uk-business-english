name: Optimize future English lessons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-future-lessons.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add inline vocabulary and usage notes
        shell: bash
        run: |
          python3 - <<'PY'
          import re, html, pathlib

          phrase_rules = [
            ("run that by me again", "<b>run that by me again</b>：再跟我说一遍/再解释一次。比单说 <i>repeat</i> 更自然，常用于会议里没听清或没理解。"),
            ("just to make sure", "<b>just to make sure</b>：只是确认一下。常放句首，用来温和地核对理解，避免显得在质疑对方。"),
            ("get back to you", "<b>get back to you</b>：稍后回复你。职场非常高频，表示先确认信息后再答复。"),
            ("have a look", "<b>have a look</b>：看一下、检查一下。英式口语里很自然，比 <i>inspect</i> 更日常。"),
            ("work for you", "<b>work for you</b>：对你来说合适吗。常用于确认时间、安排或方案是否可行。"),
            ("would you mind", "<b>Would you mind + doing...?</b>：介意做……吗？很礼貌的请求结构，后面接动名词。"),
            ("could you let me know", "<b>Could you let me know...?</b>：你可以告诉/提醒我……吗？礼貌且高频，适合请对方后续通知你。"),
            ("let me know", "<b>let me know</b>：告诉我/通知我。比 <i>tell me</i> 更柔和，常用于后续更新。"),
            ("leave from", "<b>leave from</b>：从……出发。问火车、航班从哪个站台/登机口出发时很常用。"),
            ("stop at", "<b>stop at</b>：停靠……。问列车是否经过某站时用 <i>Does this train stop at...?</i>。"),
            ("on time", "<b>on time</b>：准时、按计划。交通和会议都常用；<i>running on time</i> = 正常准点运行。"),
            ("change trains", "<b>change trains</b>：换乘火车。英国交通里常说 <i>change at + 车站</i>。"),
            ("seat taken", "<b>Is this seat taken?</b>：这个座位有人吗？非常自然，比直译“Is there someone?”更地道。"),
            ("just over there", "<b>just over there</b>：就在那边。<i>just</i> 在这里有“就在、不远”的感觉。"),
            ("what if", "<b>What if...?</b>：要不……怎么样？提出替代方案时很自然，语气比直接命令柔和。"),
            ("how about", "<b>How about + 名词/doing?</b>：……怎么样？用于轻松提出建议。"),
            ("worth considering", "<b>worth considering</b>：值得考虑。<i>worth + doing</i> 是高频结构。"),
            ("one option would be", "<b>One option would be...</b>：一个方案可以是……。很适合会议中提出建议，不显得强硬。"),
            ("might be better to", "<b>might be better to...</b>：也许……会更好。用 <i>might</i> 弱化语气，适合讨论方案。"),
            ("air conditioning", "<b>air conditioning</b>：空调。酒店报修时常简写为 <i>the air con</i>。"),
            ("key card", "<b>key card</b>：房卡。酒店里比单说 <i>key</i> 更准确。"),
            ("housekeeping", "<b>housekeeping</b>：酒店客房服务/保洁部门。需要毛巾、清洁等可联系 housekeeping。"),
            ("send someone up", "<b>send someone up</b>：派人上来。酒店房间报修时很常见。"),
            ("have a problem with", "<b>have a problem with...</b>：……有问题。描述设备、房间、网络故障时很实用。"),
            ("does that suit you", "<b>Does that suit you?</b>：那个时间对你合适吗？英式英语里 <i>suit</i> 常用于时间安排。"),
            ("works for me", "<b>works for me</b>：我这边可以/对我合适。确认时间或方案时非常自然。"),
            ("pencil it in", "<b>pencil it in</b>：暂定下来。表示先放进日程，但之后还可能调整。"),
            ("calendar invite", "<b>calendar invite</b>：日历邀请。职场里常说 <i>send a calendar invite</i>。"),
            ("clash with", "<b>clash with</b>：和……时间冲突。安排会议时很常用。"),
            ("mobile data", "<b>mobile data</b>：移动数据。英国日常一般不用 <i>cellular data</i>。"),
            ("top up", "<b>top up</b>：充值。英国手机卡、交通卡都很常见。"),
            ("data roaming", "<b>data roaming</b>：数据漫游。出国时检查是否需要开启或是否会收费。"),
            ("personal hotspot", "<b>personal hotspot</b>：个人热点。也常直接说 <i>hotspot</i>。"),
            ("signal", "<b>signal</b>：手机信号。<i>I’ve got no signal.</i> = 我没信号。"),
            ("coverage", "<b>coverage</b>：网络覆盖。问某运营商在某地区信号好不好时常用。"),
            ("catch that", "<b>catch that</b>：听清/听懂刚才那句话。<i>I didn’t quite catch that.</i> 很礼貌。"),
            ("what do you mean by", "<b>What do you mean by...?</b>：你说的……具体是什么意思？用于澄清某个词或说法。"),
            ("understood correctly", "<b>understood correctly</b>：理解正确。常用于复述后确认双方理解一致。"),
            ("could you clarify", "<b>Could you clarify...?</b>：你可以澄清一下……吗？职场高频，比直接说 <i>Explain</i> 更礼貌。"),
            ("out of stock", "<b>out of stock</b>：缺货。反义是 <i>in stock</i>（有货）。"),
            ("in stock", "<b>in stock</b>：有现货。购物时可问 <i>Do you have this in stock?</i>。"),
            ("self-checkout", "<b>self-checkout</b>：自助结账机。英国超市非常常见。"),
            ("checkout", "<b>checkout</b>：结账处/收银台。注意酒店“退房”是 <i>check out</i> 两个词。"),
            ("aisle", "<b>aisle</b>：货架通道。超市问商品在哪一排时非常实用。"),
            ("follow up", "<b>follow up</b>：跟进。职场高频，可说 <i>follow up on + 事情</i>。"),
            ("give me a hand", "<b>give me a hand</b>：帮我一下。自然口语，比 <i>assist me</i> 更日常。"),
            ("take a look", "<b>take a look</b>：看一下。美英都常用，工作中请同事帮忙检查很自然。"),
            ("send that over", "<b>send that over</b>：把那个发过来。邮件、文件、链接都可以用。"),
            ("when you get a chance", "<b>when you get a chance</b>：你有空的时候。很适合礼貌催办，降低压迫感。"),
            ("underground", "<b>the Underground</b>：伦敦地铁。日常也常说 <i>the Tube</i>。"),
            ("get off", "<b>get off</b>：下车。公交、地铁、火车都可以用。"),
            ("change at", "<b>change at + 站名</b>：在某站换乘。英国问路非常高频。"),
            ("walking distance", "<b>walking distance</b>：步行可到的距离。常说 <i>within walking distance</i>。"),
            ("go with", "<b>go with</b>：选择/采用某个方案。会议决定时比 <i>choose</i> 更口语。"),
            ("on the same page", "<b>on the same page</b>：理解一致、目标一致。职场里很常见的比喻表达。"),
            ("have reservations", "<b>have reservations</b>：有保留意见/顾虑。语气比直接反对柔和。"),
            ("settle on", "<b>settle on</b>：最终选定。讨论多个方案后决定某一个时用。"),
            ("try it on", "<b>try it on</b>：试穿。衣服、鞋子都可以用。"),
            ("fitting room", "<b>fitting room</b>：试衣间。英国商店非常常见。"),
            ("size up", "<b>size up</b>：换大一号。<i>size down</i> = 换小一号。"),
            ("exchange", "<b>exchange</b>：换货。购物退换场景里和 <i>refund</i>（退款）要区分。"),
            ("refund", "<b>refund</b>：退款。可说 <i>Could I get a refund?</i>。"),
            ("behind schedule", "<b>behind schedule</b>：进度落后。项目状态汇报里很高频。"),
            ("on track", "<b>on track</b>：按计划进行。反义常见 <i>off track</i>。"),
            ("pushed back", "<b>pushed back</b>：被推迟。<i>push back the deadline</i> = 延后截止时间。"),
            ("next steps", "<b>next steps</b>：下一步行动。会议结束和项目汇报都很常见。"),
            ("grab lunch", "<b>grab lunch</b>：一起吃个午饭/随便吃点。语气轻松，适合同事之间。"),
            ("fancy", "<b>fancy + 名词/doing?</b>：想不想……？很英式、很自然的邀请方式。"),
            ("up to much", "<b>up to much</b>：忙什么/有什么安排。<i>Are you up to much this weekend?</i> 是轻松寒暄。"),
            ("you’re on mute", "<b>You’re on mute.</b>：你静音了。视频会议超高频。"),
            ("you're on mute", "<b>You're on mute.</b>：你静音了。视频会议超高频。"),
            ("cutting out", "<b>cutting out</b>：声音断断续续。网络会议里常说 <i>You’re cutting out.</i>。"),
            ("share my screen", "<b>share my screen</b>：共享我的屏幕。远程会议高频固定搭配。"),
            ("drop off", "<b>drop off</b>：这里指连接中断/掉线。也可指“顺路送到”。注意根据语境理解。"),
            ("check out", "<b>check out</b>：退房。酒店里常说 <i>What time do I need to check out?</i>。"),
            ("leave my luggage", "<b>leave my luggage</b>：寄存行李。也常说 <i>store my luggage</i>。"),
            ("keep my luggage", "<b>keep my luggage</b>：帮我保管行李。酒店前台语境里可理解为寄存。"),
            ("action point", "<b>action point</b>：行动项。会议后明确“谁做什么”时很常用。"),
            ("take ownership", "<b>take ownership</b>：负责到底/承担责任。比单纯 <i>do</i> 更强调责任归属。"),
            ("by end of day", "<b>by end of day</b>：今天结束前。工作里常缩写为 EOD，但口语直接说全称更清楚。"),
            ("sore throat", "<b>sore throat</b>：喉咙痛。药店描述症状时很常用。"),
            ("blocked nose", "<b>blocked nose</b>：鼻塞。英式日常说法；美式也常说 <i>stuffy nose</i>。"),
            ("painkiller", "<b>painkiller</b>：止痛药。英国药店常用词。"),
            ("over the counter", "<b>over the counter</b>：非处方可购买。常缩写 OTC。"),
            ("walk you through", "<b>walk you through</b>：一步步带你看/讲解。演示和培训里非常高频。"),
            ("move on to", "<b>move on to</b>：接着讲/进入下一个部分。演示转场常用。"),
            ("come back to", "<b>come back to</b>：稍后再回到这个问题。回答问题时很实用。"),
            ("can everyone see", "<b>Can everyone see...?</b>：大家都能看到……吗？共享屏幕后常用。"),
            ("card declined", "<b>card declined</b>：银行卡被拒付。付款失败时常见提示。"),
            ("contactless", "<b>contactless</b>：非接触式支付。英国刷卡/手机支付场景极高频。"),
            ("pin", "<b>PIN</b>：银行卡密码。英国常说 <i>enter your PIN</i>。"),
            ("receipt", "<b>receipt</b>：收据/小票。购物、酒店、报销都很常用。"),
            ("deadline", "<b>deadline</b>：截止时间。可搭配 <i>meet / miss / move a deadline</i>。"),
            ("due by", "<b>due by</b>：最迟在……前到期/完成。工作进度和截止时间常用。"),
            ("no rush", "<b>no rush</b>：不着急。礼貌催办时可缓和语气，但后面仍可说明期望时间。"),
            ("check in", "<b>check in</b>：办理值机/入住。机场和酒店都常用，具体看语境。"),
            ("boarding pass", "<b>boarding pass</b>：登机牌。"),
            ("hand luggage", "<b>hand luggage</b>：手提行李。英式比 <i>carry-on</i> 更常见。"),
            ("hold luggage", "<b>hold luggage</b>：托运行李。英国航空语境常用。"),
            ("baggage allowance", "<b>baggage allowance</b>：行李额度/限额。包含件数或重量限制。"),
            ("security", "<b>security</b>：机场安检。<i>go through security</i> = 过安检。"),
            ("keep in touch", "<b>keep in touch</b>：保持联系。出差结束告别客户时很自然。"),
            ("safe journey", "<b>safe journey</b>：一路平安。英式告别很常见。"),
            ("pleasure working with", "<b>It’s been a pleasure working with you.</b>：很高质量的商务告别表达，礼貌但不生硬。"),
            ("boarding", "<b>boarding</b>：登机。<i>boarding starts at...</i> = ……开始登机。"),
            ("gate change", "<b>gate change</b>：登机口变更。机场广播和屏幕常见。"),
            ("final call", "<b>final call</b>：最后登机广播。听到后应尽快前往登机口。"),
            ("delayed", "<b>delayed</b>：延误。交通、航班、项目进度都可用。"),
            ("cancelled", "<b>cancelled</b>：取消。英式拼写通常双 l。")
          ]

          word_rules = {
            "platform": "<b>platform</b>：站台。英国火车站问路高频词。",
            "approach": "<b>approach</b>：做法、方案。工作语境里常指处理问题的方法。",
            "concern": "<b>concern</b>：顾虑、担忧。<i>have a concern about...</i> = 对……有顾虑。",
            "timing": "<b>timing</b>：时间安排/时机。常用于讨论方案是否合适。",
            "reschedule": "<b>reschedule</b>：改期。<i>reschedule the meeting</i> = 重新安排会议时间。",
            "available": "<b>available</b>：有空/可用。约时间时 <i>Are you available...?</i> 非常常见。",
            "roaming": "<b>roaming</b>：漫游。",
            "clarify": "<b>clarify</b>：澄清、说清楚。比 <i>explain again</i> 更适合工作语境。",
            "suggest": "<b>suggest</b>：建议。<i>What do you suggest?</i> = 你有什么建议？",
            "sensible": "<b>sensible</b>：合理的、明智的。英式口语里很常见。",
            "refund": "<b>refund</b>：退款。",
            "exchange": "<b>exchange</b>：换货。",
            "receipt": "<b>receipt</b>：收据/小票。",
            "invoice": "<b>invoice</b>：发票/账单，商务报销语境常见。",
            "deadline": "<b>deadline</b>：截止时间。",
            "delay": "<b>delay</b>：延迟、延误。",
            "issue": "<b>issue</b>：问题。工作中比 <i>problem</i> 更中性。",
            "update": "<b>update</b>：最新进展/更新。<i>give you an update</i> = 告诉你最新进展。",
            "pharmacist": "<b>pharmacist</b>：药剂师。英国药店可直接向 pharmacist 咨询常见小问题。",
            "presentation": "<b>presentation</b>：演示/汇报。",
            "boarding": "<b>boarding</b>：登机。"
          }

          phrase_rules.sort(key=lambda x: len(x[0]), reverse=True)

          def clean_text(s):
              return html.unescape(re.sub(r'<[^>]+>', '', s)).strip()

          def explain(sentence):
              lower = sentence.lower().replace('’', "'")
              notes = []
              used = set()
              for needle, note in phrase_rules:
                  if needle in lower and needle not in used:
                      notes.append(note); used.add(needle)
                      if len(notes) >= 2: break
              if len(notes) < 2:
                  for word, note in word_rules.items():
                      if re.search(r'\b'+re.escape(word)+r'\b', lower) and word not in used:
                          notes.append(note); used.add(word)
                          if len(notes) >= 2: break
              if not notes:
                  if lower.startswith("could you "):
                      notes.append("<b>Could you...?</b>：礼貌请求的高频开头，比直接祈使句更柔和。")
                  elif lower.startswith("could we "):
                      notes.append("<b>Could we...?</b>：礼貌提出建议/替代方案，适合会议讨论。")
                  elif lower.startswith("would it be possible"):
                      notes.append("<b>Would it be possible...?</b>：非常礼貌地询问是否可行。")
                  elif lower.startswith("i'd prefer") or lower.startswith("i would prefer"):
                      notes.append("<b>prefer to + 动词原形</b>：更倾向于做……；表达偏好但不过分强硬。")
                  elif lower.startswith("i'm afraid"):
                      notes.append("<b>I’m afraid...</b>：这里不是“害怕”，而是礼貌地引出坏消息或不同意见。")
                  elif lower.startswith("do you mind if"):
                      notes.append("<b>Do you mind if...?</b>：你介意我……吗？礼貌征求许可。")
              return notes[:2]

          css = ".usage{margin:7px 0 9px;padding:9px 11px;border-radius:11px;background:var(--soft);font-size:13px;line-height:1.55;color:var(--ink)}.usage b{color:var(--brand)}.usage-label{display:inline-block;margin-right:6px;font-size:11px;font-weight:800;color:var(--brand)}"
          pair_re = re.compile(r'(<p class="en"[^>]*>(.*?)</p>.*?<p class="zh">.*?</p>)(?!\s*<div class="usage")', re.S)

          changed = []
          qa = []
          forbidden = ['ɹ','ɐ','\u200b','\u200d','wɪðð','ɪnðə']
          for day in range(15, 38):
              p = pathlib.Path(f'day{day:02d}.html')
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'<div class="usage">.*?</div>', '', text, flags=re.S)
              if '.usage{' not in text:
                  text = text.replace('.dialogue{', css + '.dialogue{', 1)
              text = re.sub(r'ukbe-balanced-natural-20260905-v4', 'ukbe-inline-glossary-20260907-v5', text)
              seen = set()
              def repl(m):
                  sentence = clean_text(m.group(2))
                  key = sentence.lower()
                  base = m.group(1)
                  if key in seen:
                      return base
                  seen.add(key)
                  notes = explain(sentence)
                  if not notes:
                      return base
                  body = '<br>'.join(notes)
                  return base + '<div class="usage"><span class="usage-label">词汇 / 用法</span>' + body + '</div>'
              text = pair_re.sub(repl, text)
              p.write_text(text, encoding='utf-8')
              items = text.count('class="item"')
              dialogs = text.count('class="dialogue"')
              usage = text.count('class="usage"')
              bad = [x for x in forbidden if x in text]
              buttons = text.count('data-say=')
              if items != 10 or dialogs != 3 or usage < 5 or bad or buttons < 16 or 'localStorage' in text:
                  raise SystemExit(f'QA failed {p}: items={items}, dialogs={dialogs}, usage={usage}, bad={bad}, buttons={buttons}')
              changed.append(str(p))
              qa.append((day, usage, buttons))

          sw = pathlib.Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = re.sub(r"const CACHE='[^']+'", "const CACHE='ukbe-20260907-inline-glossary-v10'", sw_text, count=1)
          sw.write_text(sw_text, encoding='utf-8')

          print('Optimized:', ', '.join(changed))
          print('QA:', qa)
          PY
      - name: Commit optimized lessons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day15.html day16.html day17.html day18.html day19.html day20.html day21.html day22.html day23.html day24.html day25.html day26.html day27.html day28.html day29.html day30.html day31.html day32.html day33.html day34.html day35.html day36.html day37.html sw.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add inline vocabulary notes to Day 15-37"
            git push origin HEAD:main
          fi
