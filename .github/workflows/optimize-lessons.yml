name: optimize-lessons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine Day 15-37 explanations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html
          triple=re.compile(r'(<p class="en"[^>]*>(.*?)</p><p class="ipa">.*?</p><p class="zh">.*?</p>)<div class="usage"><b>整句</b>＝.*?</div>',re.I|re.S)
          def clean(x): return html.unescape(re.sub('<[^>]+>','',x)).strip()
          def explain(en):
              x=en.lower().replace('’',"'")
              rules=[
                (r'^is this the .+ to ', 'Is this the … to + 地点?＝确认“这是去……的……吗？”，火车、巴士等交通场景都能套用。'),
                (r'^does this .+ stop at ', 'stop at + 地点＝“在某地停靠”；用 Does this … stop at …? 询问线路是否经停。'),
                (r'^what time does .+ leave', 'What time does … leave?＝询问“几点出发 / 发车”，leave 在交通场景里就是“出发”。'),
                (r'^where can i ', 'Where can I + 动词…?＝“我在哪里可以……？”，找售票处、洗手间、充电点等都能复用。'),
                (r'^do you have .+ in ', 'Do you have this in + 尺码/颜色?＝询问“这个有没有某个尺码/颜色”，购物时非常高频。'),
                (r'^do you have ', 'Do you have…?＝询问“你们有……吗？”，可用于商品、药品、服务或可用选项。'),
                (r'^is (it|the|this) ', 'Is …?＝用来确认当前状态或信息；日常交流里比直接猜测更稳妥。'),
                (r'^what time will ', 'What time will …?＝询问未来具体时间，例如开始、结束或到达时间。'),
                (r'^who is ', 'Who is …?＝确认负责人 / 对象是谁；工作里常用来明确责任。'),
                (r'^when do we need ', 'When do we need …?＝确认截止时间；若后面带 by，by 表示“最晚在……之前”。'),
                (r'^does everyone ', 'Does everyone…?＝向整个团队确认状态或理解情况，会议收尾很实用。'),
                (r'^that sounds ', 'That sounds + 形容词＝“听起来……”，用于评价或回应对方建议。'),
                (r'^yes,? it does', 'Yes, it does.＝对 Does…? 问句的自然肯定回答，不需要重复整句话。'),
                (r'^no,? it', 'No, it…＝自然否定回答；后面通常补充当前真实状态。'),
                (r'^i think ', 'I think…＝“我觉得……”，把判断说得更柔和，职场讨论比直接下结论更自然。'),
                (r'^we can ', 'We can…＝提出一种可行做法；语气比命令式更合作。'),
                (r'^another option is to ', 'Another option is to…＝“另一个方案是……”，用于补充备选方案。'),
                (r'^this is ', 'This is…＝指明当前对象/情况；配合后面的描述可直接用于现场确认。'),
                (r'^where are ', 'Where are…?＝询问某个地点/设施在哪里，后接复数名词。'),
                (r'^how much ', 'How much…?＝询问数量、价格或不可数名词的多少，具体含义看后面的名词。'),
                (r'^how long ', 'How long…?＝询问“多久 / 多长时间”，常用于等待、延误、症状持续时间。'),
                (r'^how often ', 'How often…?＝询问频率“多久一次”，在药店、工作节奏等场景都常见。'),
                (r'^have i ', 'Have I…?＝用来确认自己是否做对 / 理解对，语气自然。'),
                (r'^so you mean ', 'So you mean…?＝“所以你的意思是……？”；把自己的理解复述给对方确认。'),
                (r'^please ', 'Please + 动词…＝礼貌请求；正式和日常场景都通用。'),
                (r'^thanks,? ', 'Thanks,…＝先表示感谢，再说明下一步；英语口语里很自然。')
              ]
              for p,t in rules:
                  if re.search(p,x): return t
              words=re.findall(r"[A-Za-z']+",en)
              stem=' '.join(words[:min(5,len(words))])
              return f'<b>{html.escape(stem)}</b>：这部分建议按固定语块来记，理解整句功能后直接替换地点、时间、对象等关键词使用。'
          for n in range(15,38):
              p=Path(f'day{n:02d}.html'); s=p.read_text(encoding='utf-8')
              def repl(m):
                  e=clean(m.group(2)); t=explain(e)
                  body=t if t.startswith('<b>') else html.escape(t)
                  return m.group(1)+f'<div class="usage">{body}</div>'
              s=triple.sub(repl,s)
              p.write_text(s,encoding='utf-8')
          for n in range(15,38):
              s=Path(f'day{n:02d}.html').read_text(encoding='utf-8')
              assert s.count('class="item"')==10
              assert s.count('class="dialogue"')==3
              assert s.count('class="usage"')>=8
              assert '<b>整句</b>' not in s
              assert 'ɹ' not in s and 'ɐ' not in s and '\u200b' not in s
              assert 'localStorage' not in s
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day15.html day16.html day17.html day18.html day19.html day20.html day21.html day22.html day23.html day24.html day25.html day26.html day27.html day28.html day29.html day30.html day31.html day32.html day33.html day34.html day35.html day36.html day37.html
          git commit -m "Refine vocabulary usage guidance for Day 15-37"
          git push
