name: optimize-lessons
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Day 15-37 explanations to each sentence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html

          PHRASES={
            'platform':'站台','leave from':'从……出发；交通场景高频','run on time':'准点运行','change trains':'换乘火车','contactless':'感应 / 非接触式支付','seat taken':'座位有人 / 被占','let me know':'告诉我 / 通知我；高频请求表达',
            'try this on':'试穿这件；try on + 衣物','changing rooms':'试衣间；英国常用 changing room','a bit too':'有点太……；比直接 too 更柔和','larger size':'大一号尺码','return this':'退货','refund':'退款；get a refund = 获得退款','receipt':'收据','fit':'合身 / 合适',
            "didn't quite catch":'没太听清；catch 在这里是“听清”','say that again':'再说一遍','more slowly':'更慢一点','mean by':'“……是什么意思”；询问具体含义','make sure i\'ve understood':'确认自己理解正确','got that right':'理解对了吗','run that by me':'再给我讲 / 过一遍；职场高频','make sense':'有道理 / 说得通',
            'go over':'快速过一遍 / 复核','next steps':'下一步行动','take care of':'负责处理','handle':'处理 / 负责','need this by':'需要在……之前完成；by 表截止时间','clear on':'对……已经清楚','action point':'行动项','action points':'行动项',
            'walk you through':'带你逐步讲解 / 演示','come back to that':'稍后再回到这个话题','feel free to':'尽管 / 随时可以；礼貌鼓励对方','come back to you':'稍后回复你','so far':'到目前为止','cover':'这里指“讲到 / 涵盖”',
            'pay by card':'刷卡 / 用卡支付','take contactless':'接受感应支付','split the bill':'分账 / AA','pay separately':'各付各的','service included':'是否已经包含服务费','charged twice':'被扣款两次','check that for me':'帮我查一下',
            'headache':'头痛','sore throat':'喉咙痛','cough':'咳嗽','something for':'用于缓解 / 治疗……的东西或药','suitable for':'适合……','how often':'多久一次','take it with food':'随餐服用','make me sleepy':'让我犯困','pharmacist':'药剂师','give that a try':'试试看',
            'check in':'办理值机 / 入住','check this bag in':'托运这个包','luggage':'行李；不可数名词','weight limit':'重量上限','aisle seat':'靠过道座位','security':'这里指机场安检','take my laptop out':'把笔记本电脑拿出来','hand luggage':'随身行李','queue':'队伍；英国非常常用','boarding':'登机',
            'gate changed':'登机口变更','flight delayed':'航班延误','how long the delay':'延误多久','board with':'和……一起登机','charge my phone':'给手机充电',
            'available':'可用的 / 有空的','reschedule':'重新安排时间','work for you':'对你来说时间 / 方案是否合适','get back to you':'稍后回复你','follow up':'跟进','on track':'按计划进行','behind schedule':'落后于计划','deadline':'截止时间','issue':'问题 / 故障；工作中比 problem 更中性','update':'进展更新','clarify':'澄清','confirm':'确认','approach':'做法 / 方案','option':'选项 / 方案','concern':'顾虑','timing':'时机 / 时间安排','risk':'风险','launch':'上线 / 发布','roll back':'回滚版本','scope':'范围','requirement':'需求','priority':'优先级','estimate':'估算','delay':'延误 / 延期',
            'takeaway':'外带','bill':'账单','tap':'轻触 / 感应','tap in':'刷卡进站','tap out':'刷卡出站','single ticket':'单程票','return ticket':'往返票','off-peak':'非高峰时段','connection':'转车 / 衔接班次','direct train':'直达车','cancelled':'取消','replacement bus':'替代巴士','mobile data':'移动数据','signal':'信号','password':'密码','network':'网络','small talk':'轻松寒暄','catch up':'聊近况 / 跟进','recommend':'推荐','local':'当地的','check out':'酒店退房','store my luggage':'寄存行李','invoice':'发票 / 账单文件','screen share':'屏幕共享','mute':'静音','unmute':'取消静音','cut out':'声音断断续续','frozen':'画面卡住','owner':'任务负责人','due':'到期 / 应完成','dosage':'剂量','side effects':'副作用','prescription':'处方','cashless':'无现金支付','boarding pass':'登机牌','checked baggage':'托运行李','hand baggage':'随身行李','security tray':'安检托盘','liquids':'液体','departure board':'航班 / 列车信息屏'
          }

          RULES=[
            (r'^which platform', '<b>Which platform…?</b>＝询问“哪个站台”；和 <b>leave from</b> 连用就是“从哪个站台出发”。'),
            (r'^is this the .+ to ', '<b>Is this the … to + 地点?</b>＝确认“这是去……的……吗？”，火车、巴士等交通场景都能套用。'),
            (r'^does this .+ stop at ', '<b>stop at + 地点</b>＝“在某地停靠”；用 Does this … stop at …? 询问线路是否经停。'),
            (r'^what time does .+ leave', '<b>What time does … leave?</b>＝询问“几点出发 / 发车”，交通场景很常用。'),
            (r'^where can i ', '<b>Where can I + 动词…?</b>＝“我在哪里可以……？”，找售票处、洗手间、充电点等都能复用。'),
            (r'^could you ', '<b>Could you…?</b>＝礼貌请求“你可以……吗？”，比直接命令更自然。'),
            (r'^could i ', '<b>Could I…?</b>＝礼貌询问“我可以……吗？”。'),
            (r'^can i ', '<b>Can I…?</b>＝日常高频询问许可或可用性。'),
            (r'^do i need to ', '<b>Do I need to…?</b>＝询问“我是否需要……”。'),
            (r'^do you have .+ in ', '<b>Do you have this in + 尺码 / 颜色?</b>＝询问某商品是否有指定版本，购物时非常高频。'),
            (r'^do you have ', '<b>Do you have…?</b>＝询问“你们有……吗？”，商品、药品、服务都能用。'),
            (r'^is (it|the|this|my) ', '<b>Is …?</b>＝用来确认当前状态或信息；现场交流非常高频。'),
            (r'^what time will ', '<b>What time will…?</b>＝询问未来具体时间，例如开始、结束或到达时间。'),
            (r'^who is ', '<b>Who is…?</b>＝确认负责人 / 对象是谁；工作里常用于明确责任。'),
            (r'^when do we need ', '<b>When do we need…?</b>＝确认截止时间；句尾 <b>by</b> 表示“最晚在……之前”。'),
            (r'^does everyone ', '<b>Does everyone…?</b>＝向整个团队确认状态或理解情况，会议收尾很实用。'),
            (r'^that sounds ', '<b>That sounds + 形容词</b>＝“听起来……”，用于回应或评价对方建议。'),
            (r'^i think ', '<b>I think…</b>＝“我觉得……”，把判断说得更柔和，职场讨论很自然。'),
            (r'^i\'d like to ', '<b>I’d like to…</b>＝“我想……”，比 I want to 更礼貌。'),
            (r'^i\'ve got ', '<b>I’ve got…</b>＝“我有 / 我出现了……”，英式口语中描述症状非常自然。'),
            (r'^i\'ve had ', '<b>I’ve had… for…</b>＝“我已经……一段时间了”，用于说明症状持续多久。'),
            (r'^shall we ', '<b>Shall we…?</b>＝“我们……好吗？”，英式英语里常用于共同决定。'),
            (r'^let\'s ', '<b>Let’s…</b>＝“我们……吧”，自然地推进下一步。'),
            (r'^maybe we should ', '<b>Maybe we should…</b>＝“也许我们应该……”，比直接命令更柔和。'),
            (r'^have i ', '<b>Have I…?</b>＝确认自己是否理解 / 做对，口语很自然。'),
            (r'^so you mean ', '<b>So you mean…?</b>＝“所以你的意思是……？”；复述自己的理解让对方确认。'),
            (r'^how long ', '<b>How long…?</b>＝询问“多久 / 多长时间”，等待、延误、症状都常用。'),
            (r'^how much ', '<b>How much…?</b>＝询问价格或不可数名词的数量。'),
            (r'^how often ', '<b>How often…?</b>＝询问频率“多久一次”。'),
            (r'^where are ', '<b>Where are…?</b>＝询问某个地点 / 设施在哪里。'),
            (r'^this is ', '<b>This is…</b>＝指明当前对象或情况，现场确认时常用。'),
            (r'^please ', '<b>Please + 动词</b>＝礼貌请求；正式和日常场景都通用。'),
            (r'^thanks', '<b>Thanks,…</b>＝先表示感谢再说明下一步，口语里很自然。')
          ]

          def clean(x): return html.unescape(re.sub('<[^>]+>','',x)).strip()
          def explain(en):
              low=en.lower().replace('’',"'")
              notes=[]
              for k,v in sorted(PHRASES.items(),key=lambda kv:len(kv[0]),reverse=True):
                  if k.lower() in low:
                      notes.append(f'<b>{html.escape(k)}</b>＝{v}')
                      if len(notes)==2: break
              if notes: return '；'.join(notes)+'。'
              for pat,text in RULES:
                  if re.search(pat,low): return text
              words=re.findall(r"[A-Za-z']+",en)
              stem=' '.join(words[:min(5,len(words))])
              return f'<b>{html.escape(stem)}</b>：把这部分当固定语块记，理解整句功能后替换地点、时间、对象等关键词即可。'

          # Replace usage cards strictly within the same sentence block.
          block=re.compile(r'(<p class="en"[^>]*>(.*?)</p><p class="ipa">[^<]*</p><p class="zh">.*?</p>)<div class="usage">.*?</div>',re.I|re.S)
          marker='</section><section class="card"><h2>3 组真实迷你对话</h2>'
          for n in range(15,38):
              p=Path(f'day{n:02d}.html'); s=p.read_text(encoding='utf-8')
              main,sep,tail=s.partition(marker)
              def repl(m): return m.group(1)+'<div class="usage">'+explain(clean(m.group(2)))+'</div>'
              main=block.sub(repl,main)
              s=main+(sep+tail if sep else '')
              p.write_text(s,encoding='utf-8')

          # Force a fresh offline cache after final content changes.
          sw=Path('sw.js'); t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const CACHE='[^']+'","const CACHE='ukbe-20260907-vocab-v11'",t)
          sw.write_text(t,encoding='utf-8')

          # Mechanical QA across every future lesson.
          for n in range(15,38):
              s=Path(f'day{n:02d}.html').read_text(encoding='utf-8')
              main=s.split(marker,1)[0]
              assert s.count('class="item"')==10, (n,'items')
              assert s.count('class="dialogue"')==3, (n,'dialogues')
              assert main.count('class="usage"')>=8, (n,'main usage')
              assert '<b>整句</b>' not in s, (n,'generic marker')
              assert 'ukbe-balanced-natural-20260907-v5' in s, (n,'standard')
              assert 'ɹ' not in s and 'ɐ' not in s and '\u200b' not in s, (n,'IPA pollution')
              assert 'localStorage' not in s, (n,'localStorage')
              # Ensure each usage immediately follows a sentence block rather than leaking from neighbours.
              assert len(block.findall(main))>=8, (n,'alignment')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add day15.html day16.html day17.html day18.html day19.html day20.html day21.html day22.html day23.html day24.html day25.html day26.html day27.html day28.html day29.html day30.html day31.html day32.html day33.html day34.html day35.html day36.html day37.html sw.js
          git commit -m "Align inline usage guidance for Day 15-37"
          git push
