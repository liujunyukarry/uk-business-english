name: One-time rebuild future English lessons
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Day 13-37 and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ukbe-data-0.b64 .github/ukbe-data-1.b64 .github/ukbe-data-2.b64 .github/ukbe-data-3.b64 | base64 -d | gzip -d > /tmp/ukbe-data.json
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python3 - <<'PY'
          import json,subprocess,html,re
          D=json.load(open('/tmp/ukbe-data.json',encoding='utf-8'))
          P=json.load(open('course-plan.json',encoding='utf-8'))
          W={13:('takeaway','外带'),14:('concern','顾虑'),15:('platform','站台'),16:('reasonable','合理的'),17:('available','可用的 / 有空的'),18:('calendar invite','日历邀请'),19:('top up','充值'),20:('catch','听清 / 听到'),21:('on offer','促销中'),22:('follow up','跟进'),23:('contactless','非接触式支付'),24:('concern','顾虑'),25:('refund','退款'),26:('on track','按计划进行'),27:('fancy','想要 / 想吃'),28:('break up','声音断断续续'),29:('luggage','行李'),30:('action point','行动项'),31:('sore throat','喉咙痛'),32:('walk through','逐步讲解'),33:('charged','被收费'),34:('hold up','耽搁 / 阻碍'),35:('aisle seat','靠过道座位'),36:('get in touch','联系'),37:('boarding','登机')}
          def E(s): return html.escape(str(s),quote=True)
          def ipa(s):
              t=subprocess.check_output(['espeak-ng','-q','--ipa=3','-v','en-gb',s],text=True).strip().replace('\u200d','').replace('\u0361','')
              return '/'+re.sub(r'\s+',' ',t).strip()+'/'
          style=""":root{--bg:#f4f6f8;--card:#fff;--ink:#182433;--muted:#687582;--line:#dfe5ea;--brand:#145b62;--soft:#eaf4f2;--warm:#f8f3e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}main{width:min(100%,820px);margin:auto;padding:14px 14px calc(30px + env(safe-area-inset-bottom))}a{color:var(--brand)}nav,.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}nav{margin:4px 0 16px}header{background:#17555b;color:#fff;border-radius:22px;padding:24px 20px}header p{margin:6px 0}h1{font-size:clamp(25px,6vw,35px);line-height:1.25;margin:6px 0}h2{font-size:21px;margin:0 0 8px}h3{font-size:16px;margin:10px 0 6px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chips span,.badge{border-radius:999px;padding:3px 8px;font-size:11px}.chips span{border:1px solid #ffffff55}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:19px;margin:15px 0}.note,.zh{color:var(--muted)}.note{font-size:13px}.group{color:var(--brand);margin:14px 0 2px}.item{display:flex;gap:11px;padding:15px 0;border-top:1px solid var(--line)}.group+.item{border-top:0}.n{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:10px;background:var(--soft);color:var(--brand);font-weight:800}.txt{min-width:0;flex:1}.badge{display:inline-block;background:var(--warm);font-weight:800}.en{font-size:18px;font-weight:680;line-height:1.45;margin:3px 0;overflow-wrap:anywhere}.ipa{font-size:14px;color:var(--brand);overflow-wrap:anywhere}p.ipa,p.zh{margin:3px 0 7px}button{min-height:44px;border:0;border-radius:11px;padding:8px 12px;background:var(--brand);color:#fff;font:inherit;touch-action:manipulation}.dialogue{padding:15px 0;border-top:1px solid var(--line)}.turn{background:var(--bg);border-radius:14px;padding:12px;margin:8px 0}.turn b{font-size:12px;color:var(--muted)}.turn .en{font-size:17px}.tip{padding:10px 0;border-top:1px solid var(--line)}.mini{min-height:40px;padding:5px 10px;margin-left:6px}footer{font-size:12px;color:var(--muted);padding:12px 0}@media(max-width:420px){main{padding:11px 9px 28px}.card{padding:16px}.en{font-size:17px}}@media(prefers-color-scheme:dark){:root{--bg:#111b24;--card:#192631;--ink:#eef3f8;--muted:#a8b6c4;--line:#30404e;--brand:#9cd9d0;--soft:#223d40;--warm:#343021}button{color:#132d2c}}"""
          for ks in sorted(D,key=lambda z:int(z)):
              day=int(ks); x=D[ks]; date,cat,title,eng=x['a']; phrases=x['p']; dialogs=x['d']
              assert len(phrases)==10 and len(dialogs)==3 and all(2<=len(q)<=3 for q in dialogs)
              prev=f'day{day-1:02d}.html'; nxt=f'day{day+1:02d}.html' if day<37 else 'index.html'
              out=[f'<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="course-standard" content="ukbe-balanced-natural-20260905-v3"><title>Day {day:02d}｜{E(title)}｜英国出差英语口语</title><style>{style}</style></head><body><main>',f'<nav><a href="index.html">← 全部课程</a><span>{E(cat)} · UK English</span></nav><header><p>{date} · DAY {day:02d}</p><h1>{E(title)}</h1><p lang="en-GB">{E(eng)}</p><p>高频、地道、难度适中；按真实场景学会怎么说。</p><div class="chips"><span>{E(cat)}场景</span><span>10 句实用口语</span><span>英式 IPA</span></div></header><section class="card"><h2>今天的 10 句</h2><p class="note">前 6 句重点掌握，后 4 句听懂也很有用。★ 只做重点标记，不重复展示。</p><h3 class="group">重点掌握 · 6 句</h3>']
              for i,(en0,zh) in enumerate(phrases):
                  if i==6: out.append('<h3 class="group">自然表达 · 4 句</h3>')
                  star='<span class="badge">★ 高频重点</span>' if i<3 else ''
                  out.append(f'<div class="item"><div class="n">{i+1}</div><div class="txt">{star}<p class="en" lang="en-GB">{E(en0)}</p><p class="ipa">{E(ipa(en0))}</p><p class="zh">{E(zh)}</p><button data-say="{E(en0)}">🔊 播放</button></div></div>')
              out.append('</section><section class="card"><h2>3 组真实迷你对话</h2><p class="note">看真实语境里怎么接话，不做题。</p>')
              for j,dlg in enumerate(dialogs,1):
                  out.append(f'<div class="dialogue"><h3>对话 {j}</h3>')
                  for sp,en0,zh in dlg:
                      out.append(f'<div class="turn"><b>{E(sp)}</b><p class="en" lang="en-GB">{E(en0)}</p><p class="ipa">{E(ipa(en0))}</p><p class="zh">{E(zh)}</p><button data-say="{E(en0)}">🔊 播放</button></div>')
                  out.append('</div>')
              word,wzh=W[day]
              uk='英国日常交流里，please / thanks 常用来把请求说得自然又礼貌。' if cat=='日常' else '英国职场更偏好自然、缓和的完整表达；把固定搭配当成整块来记，比逐字翻译更实用。'
              out.append(f'</section><section class="card"><h2>有余力再看</h2><h3>难词 / 高频词组</h3><div class="tip"><b>{E(word)}</b> <span class="ipa">{E(ipa(word))}</span> · {E(wzh)} <button class="mini" data-say="{E(word)}">🔊</button></div><h3>英国常见说法</h3><p>{uk}</p><h3>易错点</h3><p>优先记整句和真实使用场景，不要逐字按中文翻译。</p><p class="note">离线朗读取决于本机是否已下载对应英式语音。</p></section><footer><div class="foot"><a href="{prev}">← 前一天</a><a href="index.html">课程目录</a><a href="{nxt}">后一天 →</a></div><p>每天约 10 分钟 · 日常与工作长期约 50/50 · 高频地道英式口语</p></footer></main><script>(()=>{{"use strict";let v=[];function l(){{v=speechSynthesis.getVoices()}}if("speechSynthesis"in window){{l();speechSynthesis.addEventListener("voiceschanged",l)}}document.addEventListener("click",e=>{{const b=e.target.closest("[data-say]");if(!b||!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.say);u.lang="en-GB";u.rate=.92;u.voice=v.find(x=>x.lang.toLowerCase()==="en-gb"&&x.localService)||v.find(x=>x.lang.toLowerCase()==="en-gb")||null;speechSynthesis.speak(u)}})}})();</script></body></html>')
              s=''.join(out)
              assert s.count('class="item"')==10 and s.count('★ 高频重点')==3 and s.count('class="dialogue"')==3 and s.count('data-say=')>=17
              assert not any(z in s for z in ['localStorage','隐藏答案','计时挑战','打卡','通关'])
              open(f'day{day:02d}.html','w',encoding='utf-8').write(s)
          cards=[]
          for x in P['lessons']:
              d=int(x['day']); cat=x.get('category',''); cards.append(f'<a class="lesson" href="{E(x["path"])}" data-search="{d} day {d:02d} {E(x["date"])} {E(cat)} {E(x["title"])} {E(x["english"])}"><div><span>DAY {d:02d} · {E(x["date"])} · {E(cat)}</span><h3>{E(x["title"])}</h3><p>{E(x["english"])}</p></div><b>→</b></a>')
          idx='''<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><title>英国出差英语口语｜每天10分钟</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182433;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:820px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #dde4ea;border-radius:19px;padding:19px;margin:15px 0}header{background:#17555b;color:#fff;border-radius:23px;padding:25px 21px}a{color:#145b62}.today{display:block;background:#145b62;color:#fff;text-decoration:none;padding:14px;border-radius:13px;font-weight:800}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 0;border-top:1px solid #dde4ea;text-decoration:none}.lesson h3{margin:2px 0;color:#182433}.lesson p,.lesson span,.note{margin:0;color:#667483;font-size:13px}input{width:100%;min-height:48px;border:1px solid #dde4ea;border-radius:12px;padding:10px 12px;font:inherit}</style></head><body><main><header><p>每天约 10 分钟</p><h1>真实英国出差口语</h1><p>日常生活约 50% · 工作约 50%<br>高频、地道、难度适中，不堆长难句，也不刻意幼化。</p></header><section class="card"><h2>今天练什么</h2><a class="today" href="day12.html">开始今天 · Day 12 · 确认客户需求与范围</a><p class="note">页面只负责提供高价值学习内容；复习和测试由你自己安排。</p></section><section class="card"><h2>全部课程</h2><input id="search" type="search" placeholder="搜索：咖啡、会议、Day 20、日期"><p id="count" class="note">共 37 天</p>'''+''.join(cards)+'''</section></main><script>const q=document.getElementById("search"),a=[...document.querySelectorAll(".lesson")],c=document.getElementById("count");q.addEventListener("input",()=>{const s=q.value.trim().toLowerCase();let n=0;a.forEach(x=>{const ok=!s||x.dataset.search.toLowerCase().includes(s);x.hidden=!ok;if(ok)n++});c.textContent=`共 ${n} 条`});if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").then(r=>{r.update();let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!done){done=true;location.reload()}})});</script></body></html>'''
          open('index.html','w',encoding='utf-8').write(idx)
          files=['./','index.html','manifest.webmanifest','course-plan.json','course-policy.md','sap-fico-handbook.html']+[f'day{i:02d}.html' for i in range(1,38)]
          sw="const CACHE='ukbe-20260905-balanced-v6';const FILES="+json.dumps(files,separators=(',',':'))+";const PREFIX='ukbe-';self.addEventListener('install',e=>e.waitUntil((async()=>{const c=await caches.open(CACHE);await c.addAll(FILES);await self.skipWaiting()})()));self.addEventListener('activate',e=>e.waitUntil((async()=>{for(const k of await caches.keys())if(k.startsWith(PREFIX)&&k!==CACHE)await caches.delete(k);await self.clients.claim()})()));self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==self.location.origin)return;const base=new URL('./',self.location.href).pathname;if(!u.pathname.startsWith(base)||u.pathname.startsWith(base+'ai-learning/'))return;const doc=e.request.mode==='navigate'||u.pathname.endsWith('.html')||u.pathname.endsWith('/');if(doc)e.respondWith((async()=>{const c=await caches.open(CACHE),clean=new Request(u.origin+u.pathname);try{const r=await fetch(e.request);if(r.ok)await c.put(clean,r.clone());return r}catch{return await c.match(clean)||new Response('该页面尚未缓存，请联网后打开一次。',{status:503,headers:{'Content-Type':'text/plain;charset=utf-8'}})}})());else e.respondWith((async()=>{const c=await caches.open(CACHE);return await c.match(e.request)||await fetch(e.request)})())});"
          open('sw.js','w',encoding='utf-8').write(sw)
          assert "balanced-v6" in sw and "mode==='navigate'" in sw
          PY
          git rm .github/ukbe-data-0.b64 .github/ukbe-data-1.b64 .github/ukbe-data-2.b64 .github/ukbe-data-3.b64 .github/workflows/rebuild-future-english.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add day13.html day14.html day15.html day16.html day17.html day18.html day19.html day20.html day21.html day22.html day23.html day24.html day25.html day26.html day27.html day28.html day29.html day30.html day31.html day32.html day33.html day34.html day35.html day36.html day37.html index.html sw.js
          git commit -m 'Rebuild future English lessons Day 13-37'
          git push
