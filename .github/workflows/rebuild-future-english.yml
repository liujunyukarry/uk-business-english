name: One-time rebuild future English lessons
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore bundled lessons
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/liujunyukarry/uk-business-english/502ea3407741198174ede394266ace968512b962/.github/workflows/rebuild-future-english.yml' -o /tmp/old-workflow.yml
          sed -n "/cat > \/tmp\/ukbe.b64 <<'EOF'/,/^EOF$/p" /tmp/old-workflow.yml | sed '1d;$d' | tr -d '\n\r ' | base64 -d > /tmp/ukbe.tar.gz
          tar -xzf /tmp/ukbe.tar.gz -C .
          git rm .github/workflows/rebuild-future-english.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add day13.html day14.html day15.html day16.html day17.html day18.html day19.html day20.html day21.html day22.html day23.html day24.html day25.html day26.html day27.html day28.html day29.html day30.html day31.html day32.html day33.html day34.html day35.html day36.html day37.html index.html sw.js
          git commit -m 'Rebuild future English lessons Day 13-37'
          git push
