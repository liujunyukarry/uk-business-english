name: Final glossary binding QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-glossary-binding.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebind explanations to the correct sentence and QA all pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, html

          PHRASES = [
            ('run that by me again', '<b>run that by me again</b>＝再跟我说一遍 / 再解释一次；会议里没听清或没理解时很自然。'),
            ('just to make sure', '<b>just to make sure</b>＝只是确认一下；常放句首，用来温和核对理解。'),
            ('get back to you', '<b>get back to you</b>＝稍后回复你；职场里表示先确认信息再答复。'),
            ('have a look', '<b>have a look</b>＝看一下 / 检查一下；英式口语很常见。'),
            ('take a look', '<b>take a look</b>＝看一下；请同事帮忙检查时很自然。'),
            ('work for you', '<b>work for you</b>＝对你来说合适 / 可行；常用于确认时间或方案。'),
            ('would you mind', '<b>Would you mind + doing...?</b>＝介意做……吗？很礼貌，后接动名词。'),
            ('could you let me know', '<b>Could you let me know...?</b>＝可以告诉 / 提醒我……吗？礼貌且高频。'),
            ('let me know', '<b>let me know</b>＝告诉我 / 通知我；比直接 tell me 更柔和。'),
            ('leave from', '<b>leave from</b>＝从……出发；火车、航班问站台/登机口时常用。'),
            ('stop at', '<b>stop at + 地点</b>＝在某地停靠；问线路是否经停时很实用。'),
            ('running on time', '<b>running on time</b>＝正在准点运行；交通场景高频。'),
            ('on time', '<b>on time</b>＝准时、按计划；交通和会议都常用。'),
            ('change trains', '<b>change trains</b>＝换乘火车；也常说 change at + 车站。'),
            ('seat taken', '<b>Is this seat taken?</b>＝这个座位有人吗？非常自然的固定问法。'),
            ('just over there', '<b>just over there</b>＝就在那边；just 有“就在、不远”的语感。'),
            ('what if', '<b>What if...?</b>＝要不……怎么样？用于提出替代方案，语气较柔和。'),
            ('how about', '<b>How about + 名词 / doing?</b>＝……怎么样？轻松提出建议。'),
            ('worth considering', '<b>worth considering</b>＝值得考虑；worth + doing 是高频结构。'),
            ('one option would be', '<b>One option would be...</b>＝一个方案可以是……；会议中提建议不显强硬。'),
            ('might be better to', '<b>might be better to...</b>＝也许……会更好；might 用来弱化语气。'),
            ('air conditioning', '<b>air conditioning</b>＝空调；酒店里也常说 air con。'),
            ('key card', '<b>key card</b>＝房卡；酒店语境比单说 key 更准确。'),
            ('housekeeping', '<b>housekeeping</b>＝酒店客房服务 / 保洁部门。'),
            ('send someone up', '<b>send someone up</b>＝派人上来；酒店房间报修时常用。'),
            ('have a problem with', '<b>have a problem with...</b>＝……有问题；描述设备、房间、网络故障很实用。'),
            ('does that suit you', '<b>Does that suit you?</b>＝那个时间对你合适吗？英式英语常用 suit 说时间安排。'),
            ('works for me', '<b>works for me</b>＝我这边可以 / 对我合适；确认时间或方案很自然。'),
            ('pencil it in', '<b>pencil it in</b>＝先暂定下来；表示日程之后仍可能调整。'),
            ('calendar invite', '<b>calendar invite</b>＝日历邀请；常说 send a calendar invite。'),
            ('clash with', '<b>clash with</b>＝和……时间冲突；安排会议很常用。'),
            ('mobile data', '<b>mobile data</b>＝移动数据；英国日常常用这一说法。'),
            ('top up', '<b>top up</b>＝充值；英国手机卡、交通卡都很常见。'),
            ('data roaming', '<b>data roaming</b>＝数据漫游；出国时常见设置。'),
            ('personal hotspot', '<b>personal hotspot</b>＝个人热点；也常直接说 hotspot。'),
            ('no signal', '<b>no signal</b>＝没信号；I’ve got no signal. 是很自然的说法。'),
            ('coverage', '<b>coverage</b>＝网络覆盖；可用来问某运营商在某地信号如何。'),
            ('catch that', '<b>catch that</b>＝听清 / 听懂刚才那句话；I didn’t quite catch that. 很礼貌。'),
            ('what do you mean by', '<b>What do you mean by...?</b>＝你说的……具体是什么意思？用于澄清术语。'),
            ('understood correctly', '<b>understood correctly</b>＝理解正确；复述后用于确认双方理解一致。'),
            ('could you clarify', '<b>Could you clarify...?</b>＝可以澄清一下……吗？比直接 Explain 更礼貌。'),
            ('out of stock', '<b>out of stock</b>＝缺货；反义 in stock＝有货。'),
            ('in stock', '<b>in stock</b>＝有现货；购物时非常高频。'),
            ('self-checkout', '<b>self-checkout</b>＝自助结账机；英国超市很常见。'),
            ('checkout', '<b>checkout</b>＝结账处 / 收银台；酒店“退房”则是 check out。'),
            ('aisle', '<b>aisle</b>＝货架通道；超市问商品在哪一排时很实用。'),
            ('follow up', '<b>follow up</b>＝跟进；常用 follow up on + 事情。'),
            ('give me a hand', '<b>give me a hand</b>＝帮我一下；自然口语，比 assist me 更日常。'),
            ('send that over', '<b>send that over</b>＝把那个发过来；文件、链接、邮件内容都能用。'),
            ('when you get a chance', '<b>when you get a chance</b>＝你有空的时候；礼貌催办时能降低压迫感。'),
            ('underground', '<b>the Underground</b>＝伦敦地铁；日常也常说 the Tube。'),
            ('get off', '<b>get off</b>＝下车；公交、地铁、火车都可以用。'),
            ('change at', '<b>change at + 站名</b>＝在某站换乘；英国交通问路高频。'),
            ('walking distance', '<b>walking distance</b>＝步行可到的距离；常说 within walking distance。'),
            ('go with', '<b>go with</b>＝选择 / 采用某个方案；会议决定时比 choose 更口语。'),
            ('on the same page', '<b>on the same page</b>＝理解一致 / 目标一致；职场常见比喻表达。'),
            ('have reservations', '<b>have reservations</b>＝有保留意见 / 顾虑；比直接反对更缓和。'),
            ('settle on', '<b>settle on</b>＝最终选定；讨论多个方案后作决定时用。'),
            ('try it on', '<b>try it on</b>＝试穿；衣服、鞋子都适用。'),
            ('fitting room', '<b>fitting room</b>＝试衣间；英国商店常见。'),
            ('size up', '<b>size up</b>＝换大一号；size down＝换小一号。'),
            ('exchange', '<b>exchange</b>＝换货；和 refund（退款）要区分。'),
            ('refund', '<b>refund</b>＝退款；Could I get a refund? 是高频问法。'),
            ('behind schedule', '<b>behind schedule</b>＝进度落后；项目状态汇报很常用。'),
            ('on track', '<b>on track</b>＝按计划进行；项目汇报高频。'),
            ('pushed back', '<b>pushed back</b>＝被推迟；push back the deadline＝延后截止时间。'),
            ('next steps', '<b>next steps</b>＝下一步行动；会议收尾和项目汇报都常用。'),
            ('grab lunch', '<b>grab lunch</b>＝一起吃个午饭 / 随便吃点；同事之间很自然。'),
            ('fancy', '<b>fancy + 名词 / doing?</b>＝想不想……？很英式、很自然的邀请方式。'),
            ('up to much', '<b>up to much</b>＝忙什么 / 有什么安排；周末寒暄常见。'),
            ("you're on mute", '<b>You’re on mute.</b>＝你静音了；视频会议超高频。'),
            ('cutting out', '<b>cutting out</b>＝声音断断续续；网络会议常说 You’re cutting out.。'),
            ('share my screen', '<b>share my screen</b>＝共享我的屏幕；远程会议固定搭配。'),
            ('drop off', '<b>drop off</b>＝这里可指连接中断 / 掉线；也可表示顺路送到，需看语境。'),
            ('check out', '<b>check out</b>＝退房；酒店里常问 What time do I need to check out?。'),
            ('leave my luggage', '<b>leave my luggage</b>＝寄存行李；也常说 store my luggage。'),
            ('action point', '<b>action point</b>＝行动项；会议后明确“谁做什么”时很常用。'),
            ('take ownership', '<b>take ownership</b>＝负责到底 / 承担责任；强调责任归属。'),
            ('end of day', '<b>by the end of the day</b>＝今天结束前；工作里常表示当天截止。'),
            ('sore throat', '<b>sore throat</b>＝喉咙痛；药店描述症状高频。'),
            ('blocked nose', '<b>blocked nose</b>＝鼻塞；英式日常说法。'),
            ('painkiller', '<b>painkiller</b>＝止痛药；英国药店常用词。'),
            ('over the counter', '<b>over the counter</b>＝非处方可购买；常缩写 OTC。'),
            ('walk you through', '<b>walk you through</b>＝一步步带你看 / 讲解；演示和培训很高频。'),
            ('move on to', '<b>move on to</b>＝接着进入下一个部分；演示转场常用。'),
            ('come back to', '<b>come back to</b>＝稍后再回到这个问题；回答问题时很实用。'),
            ('can everyone see', '<b>Can everyone see...?</b>＝大家都能看到……吗？共享屏幕后常用。'),
            ('card declined', '<b>card declined</b>＝银行卡被拒付；付款失败常见提示。'),
            ('contactless', '<b>contactless</b>＝非接触式 / 感应支付；英国付款场景极高频。'),
            ('pin', '<b>PIN</b>＝银行卡密码；常说 enter your PIN。'),
            ('receipt', '<b>receipt</b>＝收据 / 小票；购物、酒店、报销都常用。'),
            ('deadline', '<b>deadline</b>＝截止时间；常搭配 meet / miss / move a deadline。'),
            ('due by', '<b>due by</b>＝最迟在……前到期 / 完成；工作截止时间常用。'),
            ('no rush', '<b>no rush</b>＝不着急；催办时可用来缓和语气。'),
            ('check in', '<b>check in</b>＝办理值机 / 入住；机场和酒店都常用。'),
            ('boarding pass', '<b>boarding pass</b>＝登机牌。'),
            ('hand luggage', '<b>hand luggage</b>＝手提行李；英式比 carry-on 更常见。'),
            ('hold luggage', '<b>hold luggage</b>＝托运行李；英国航空语境常用。'),
            ('baggage allowance', '<b>baggage allowance</b>＝行李额度 / 限额；包括件数或重量限制。'),
            ('security', '<b>security</b>＝机场安检；go through security＝过安检。'),
            ('keep in touch', '<b>keep in touch</b>＝保持联系；出差结束告别客户很自然。'),
            ('safe journey', '<b>safe journey</b>＝一路平安；英式告别常见。'),
            ('pleasure working with', '<b>It’s been a pleasure working with you.</b>＝很自然、得体的商务告别表达。'),
            ('final call', '<b>final call</b>＝最后登机广播；听到后应尽快前往登机口。'),
            ('gate change', '<b>gate change</b>＝登机口变更；机场屏幕和广播常见。'),
            ('boarding', '<b>boarding</b>＝登机；boarding starts at...＝……开始登机。'),
            ('delayed', '<b>delayed</b>＝延误 / 推迟；交通和项目进度都可用。'),
            ('cancelled', '<b>cancelled</b>＝取消；英式拼写通常双 l。')
          ]
          PHRASES.sort(key=lambda x: len(x[0]), reverse=True)

          WORDS = {
            'platform':'<b>platform</b>＝站台；英国火车站高频词。',
            'approach':'<b>approach</b>＝做法 / 方案；工作语境常指处理问题的方法。',
            'concern':'<b>concern</b>＝顾虑 / 担忧；have a concern about...＝对……有顾虑。',
            'timing':'<b>timing</b>＝时间安排 / 时机；常用于讨论方案是否合适。',
            'reschedule':'<b>reschedule</b>＝改期；reschedule the meeting＝重新安排会议时间。',
            'available':'<b>available</b>＝有空 / 可用；约时间时非常常见。',
            'roaming':'<b>roaming</b>＝漫游；手机网络场景常见。',
            'clarify':'<b>clarify</b>＝澄清 / 说清楚；比 explain again 更适合工作语境。',
            'suggest':'<b>suggest</b>＝建议；What do you suggest?＝你有什么建议？',
            'sensible':'<b>sensible</b>＝合理的 / 明智的；英式口语很常见。',
            'invoice':'<b>invoice</b>＝发票 / 账单；商务报销语境常见。',
            'issue':'<b>issue</b>＝问题；工作中往往比 problem 更中性。',
            'update':'<b>update</b>＝最新进展 / 更新；give you an update＝告诉你最新进展。',
            'pharmacist':'<b>pharmacist</b>＝药剂师；英国药店可直接向 pharmacist 咨询常见问题。',
            'presentation':'<b>presentation</b>＝演示 / 汇报。',
            'coverage':'<b>coverage</b>＝网络覆盖。'
          }

          STRUCTURES = [
            (r'^is this the .+ to ', 'Is this the … to + 地点?＝“这是去……的……吗？”；火车、巴士等交通工具都能套用。'),
            (r'^does this .+ stop at ', 'Does this … stop at + 地点?＝询问线路是否经停某地。'),
            (r'^what time does .+ leave', 'What time does … leave?＝询问几点出发 / 发车。'),
            (r'^where can i ', 'Where can I + 动词…?＝“我在哪里可以……？”；找售票处、洗手间等都能复用。'),
            (r'^can i ', 'Can I + 动词…?＝询问“我可以……吗？”；日常请求和确认权限都常用。'),
            (r'^could you ', 'Could you + 动词…?＝礼貌请求，比直接祈使句更柔和。'),
            (r'^could we ', 'Could we + 动词…?＝礼貌提出建议 / 替代方案，适合会议讨论。'),
            (r'^would it be possible', 'Would it be possible…?＝非常礼貌地询问是否可行。'),
            (r"^i'd like", 'I’d like...＝“我想要 / 我希望……”；比 I want 更礼貌自然。'),
            (r"^i'd prefer", 'I’d prefer to + 动词原形＝“我更倾向于……”；表达偏好但不过分强硬。'),
            (r"^i'm afraid", 'I’m afraid...＝这里不是“害怕”，而是礼貌引出坏消息或不同意见。'),
            (r'^do you mind if', 'Do you mind if...?＝“你介意我……吗？”；礼貌征求许可。'),
            (r'^do you have ', 'Do you have…?＝询问“你们有……吗？”；商品、药品、服务都能用。'),
            (r'^is (it|the|this) ', 'Is …?＝用来确认当前状态或信息；日常交流很高频。'),
            (r'^what time will ', 'What time will …?＝询问未来具体时间，例如开始、结束或到达。'),
            (r'^who is ', 'Who is …?＝确认负责人 / 对象是谁；工作里常用于明确责任。'),
            (r'^when do we need ', 'When do we need …?＝确认截止时间；by 表示“最晚在……之前”。'),
            (r'^does everyone ', 'Does everyone…?＝向整个团队确认状态或理解情况，会议收尾实用。'),
            (r'^that sounds ', 'That sounds + 形容词＝“听起来……”；用于评价或回应对方建议。'),
            (r'^i think ', 'I think…＝“我觉得……”；把判断说得更柔和，职场讨论更自然。'),
            (r'^we can ', 'We can…＝提出一种可行做法；语气比命令式更合作。'),
            (r'^another option is to ', 'Another option is to…＝“另一个方案是……”；用于补充备选方案。'),
            (r'^how long ', 'How long…?＝询问“多久 / 多长时间”；等待、延误、症状都能用。'),
            (r'^how often ', 'How often…?＝询问频率“多久一次”。'),
            (r'^so you mean ', 'So you mean…?＝“所以你的意思是……？”；复述自己的理解让对方确认。'),
            (r'^please ', 'Please + 动词…＝礼貌请求；正式和日常都通用。')
          ]

          def text_only(x):
              return html.unescape(re.sub(r'<[^>]+>', '', x)).strip()

          def explain(en, zh):
              low = en.lower().replace('’', "'")
              notes=[]
              for needle,note in PHRASES:
                  if needle in low and note not in notes:
                      notes.append(note)
                      if len(notes)==2: return '<br>'.join(notes)
              for pat,note in STRUCTURES:
                  if re.search(pat,low) and note not in notes:
                      notes.append(note)
                      if len(notes)==2: return '<br>'.join(notes)
                      break
              for word,note in WORDS.items():
                  if re.search(r'\b'+re.escape(word)+r'\b',low) and note not in notes:
                      notes.append(note)
                      if len(notes)==2: break
              if notes: return '<br>'.join(notes)
              words=re.findall(r"[A-Za-z']+",en)
              stem=' '.join(words[:min(5,len(words))])
              return f'<b>{html.escape(stem)}…</b>＝“{html.escape(zh)}”；建议把这句作为完整语块记忆，再按场景替换地点、时间或对象。'

          MAIN_START='<section class="card"><h2>今天的 10 句</h2>'
          NEXT='<section class="card"><h2>3 组真实迷你对话</h2>'
          bad_chars=['ɹ','ɐ','\u200b','\u200d','wɪðð','ɪnðə']
          report=[]
          for n in range(15,38):
              p=Path(f'day{n:02d}.html')
              s=p.read_text(encoding='utf-8')
              a=s.index(MAIN_START)
              b=s.index(NEXT,a)
              pre=s[:a]; main=s[a:b]; post=s[b:]
              parts=main.split('<div class="item">')
              assert len(parts)==11, (n,len(parts)-1)
              out=[parts[0]]
              for part in parts[1:]:
                  part=re.sub(r'<div class="usage"(?:\s+data-for="[^"]*")?>.*?</div>','',part,flags=re.S)
                  em=re.search(r'<p class="en"[^>]*>(.*?)</p>',part,re.S)
                  zm=re.search(r'<p class="zh">(.*?)</p>',part,re.S)
                  assert em and zm, n
                  en=text_only(em.group(1)); zh=text_only(zm.group(1))
                  note=explain(en,zh)
                  data=html.escape(en,quote=True)
                  usage=f'<div class="usage" data-for="{data}">{note}</div>'
                  part=re.sub(r'(<p class="zh">.*?</p>)',r'\1'+usage,part,count=1,flags=re.S)
                  out.append(part)
              s=pre+'<div class="item">'.join(out)+post
              s=s.replace('ukbe-balanced-natural-20260907-v5','ukbe-glossary-bound-20260907-v6')
              p.write_text(s,encoding='utf-8')

              # Mechanical binding QA: each main sentence owns exactly one note and its hidden data-for matches that sentence.
              main=s[s.index(MAIN_START):s.index(NEXT,s.index(MAIN_START))]
              chunks=main.split('<div class="item">')[1:]
              assert len(chunks)==10
              for chunk in chunks:
                  en=text_only(re.search(r'<p class="en"[^>]*>(.*?)</p>',chunk,re.S).group(1))
                  ums=re.findall(r'<div class="usage" data-for="([^"]*)">(.*?)</div>',chunk,re.S)
                  assert len(ums)==1, (n,en,len(ums))
                  assert html.unescape(ums[0][0])==en, (n,en,html.unescape(ums[0][0]))
                  assert len(text_only(ums[0][1]))>=8
              assert s.count('class="item"')==10
              assert s.count('class="dialogue"')==3
              assert 'localStorage' not in s
              assert not any(x in s for x in bad_chars), n
              assert s.count('data-say=')>=16
              report.append((n,10,s.count('data-say=')))

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=re.sub(r"const CACHE='[^']+'","const CACHE='ukbe-20260907-glossary-bound-v11'",w,count=1)
          sw.write_text(w,encoding='utf-8')
          print('ALL_23_PAGES_BINDING_QA_PASS',report)
          PY
      - name: Commit final corrected lessons
        shell: bash
