<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="color-scheme" content="light dark"><title>英国出差英语口语｜每天10分钟</title><style>:root{--bg:#f4f6f8;--card:#fff;--ink:#182433;--muted:#667483;--line:#dde4ea;--brand:#145b62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:820px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:19px;padding:19px;margin:15px 0}header{background:#17555b;color:#fff;border-radius:23px;padding:25px 21px}a{color:var(--brand)}.today{display:block;background:var(--brand);color:#fff;text-decoration:none;padding:14px;border-radius:13px;font-weight:800}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 0;border-top:1px solid var(--line);text-decoration:none}.lesson h3{margin:2px 0;color:var(--ink)}.lesson p,.lesson span,.note{margin:0;color:var(--muted);font-size:13px}input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:var(--card);color:var(--ink)}@media(prefers-color-scheme:dark){:root{--bg:#111b24;--card:#192631;--ink:#eef3f8;--muted:#a8b6c4;--line:#30404e;--brand:#78c9c0}.today{color:#102b2a}}</style></head><body><main><header><p>每天约 10 分钟</p><h1>真实英国出差口语</h1><p>日常生活约 50% · 工作约 50%<br>高频、地道、难度适中，不堆长难句，也不刻意幼化。</p></header><section class="card"><h2>今天练什么</h2><a class="today" id="todayLink" href="#">正在读取今天的课程…</a><p class="note" id="todayNote">按北京时间自动匹配，不需要每天手工修改首页。</p></section><section class="card"><h2>全部课程</h2><input id="search" type="search" placeholder="搜索：咖啡、会议、Day 38、日期"><p id="count" class="note">正在读取课程计划…</p><div id="lessons"></div></section><section class="card"><h2>专项口语手册</h2><a class="lesson" href="sap-fico-handbook.html"><div><h3>SAP FICO 商务英语口语手册</h3><p>完整专题独立保存，不占用每天 10 分钟的通用口语课程</p></div><b>→</b></a></section><footer class="note">英国出差英语口语 · 每天约10分钟</footer></main><script>(()=>{"use strict";let L=[];function shanghaiDate(){const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const o={};for(const p of parts)if(p.type!=="literal")o[p.type]=p.value;return o.year+"-"+o.month+"-"+o.day}function setTodayLesson(){const d=shanghaiDate(),a=document.querySelector("#todayLink"),n=document.querySelector("#todayNote");if(!L.length){a.textContent="课程计划暂时无法读取";a.removeAttribute("href");n.textContent="请联网刷新一次；课程数据来自 course-plan.json。";return}let x=L.find(v=>v.date===d);if(x){a.href=x.path;a.textContent="开始今天 · Day "+String(x.day).padStart(2,"0")+" · "+x.title;n.textContent=d+" · "+x.category+" · 按 Asia/Shanghai 自动匹配";return}if(d<L[0].date){x=L[0];a.href=x.path;a.textContent="课程将于 "+x.date+" 开始 · Day "+String(x.day).padStart(2,"0")+" · "+x.title;return}x=L[L.length-1];a.href=x.path;a.textContent="当前课程计划到 Day "+String(x.day).padStart(2,"0")+" · "+x.title;n.textContent="当前课程计划已结束；请查看每日定时消息中的当日课程，并安排下一批课程预生成。"}function draw(q=""){q=q.trim().toLowerCase();const a=L.filter(x=>[x.day,x.date,x.category,x.title,x.english].join(" ").toLowerCase().includes(q)||("day "+x.day).includes(q));document.querySelector("#lessons").innerHTML=a.map(x=>'<a class="lesson" href="'+x.path+'"><div><span>DAY '+String(x.day).padStart(2,"0")+' · '+x.date+' · '+x.category+'</span><h3>'+x.title+'</h3><p>'+x.english+'</p></div><b>→</b></a>').join("");document.querySelector("#count").textContent="共 "+a.length+" 天"}async function load(){try{const r=await fetch("course-plan.json",{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const p=await r.json();L=Array.isArray(p.lessons)?p.lessons:[];setTodayLesson();draw()}catch(e){setTodayLesson();document.querySelector("#count").textContent="课程计划读取失败"}}document.querySelector("#search").addEventListener("input",e=>draw(e.target.value));load()})();</script></body></html>
