<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>打开英语课程</title><style>body{font:17px/1.7 -apple-system,sans-serif;background:#f3f5f7;color:#172536;margin:0;padding:50px 24px}main{max-width:500px;margin:auto;background:white;border-radius:20px;padding:28px}a{color:#145b62}</style></head><body><main><h1>打开英语课程</h1><p id="message">这个入口已更新，请从课程目录继续。</p><a id="destination" href="/uk-business-english/">查看全部课程 →</a></main><script>const match=location.pathname.match(/^\/uk-business-english\/day(\d{2})_\d+\.html$/);if(match&&Number(match[1])>=1&&Number(match[1])<=37){const url='/uk-business-english/day'+match[1]+'.html';document.getElementById('message').textContent='正在打开这一天的最新课程…';document.getElementById('destination').href=url;document.getElementById('destination').textContent='打开最新课程 →';location.replace(url);}</script></body></html>
